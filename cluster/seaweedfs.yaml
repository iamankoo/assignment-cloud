# SeaweedFS with the S3 gateway on :8333, single replica, PVC-backed. NOT APPLIED yet.
# The s3 identity file comes from Secret `seaweedfs-s3-config` (created by scripts/deploy.sh from .env).
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.68
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/s3/s3.json"]
          ports: [{containerPort: 8333}]
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 30
            periodSeconds: 10
          # 1.5 GiB memory limit, as described in the student's reflection (OOM during model uploads).
          # This is my own manifest aligned to that description, not the student's original file (not provided).
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3cfg, mountPath: /etc/s3}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3cfg
          secret: {secretName: seaweedfs-s3-config}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
spec:
  selector: {app: seaweedfs}
  ports: [{port: 8333, targetPort: 8333}]

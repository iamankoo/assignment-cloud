# Parallel teacher labelling: Indexed Job, 2 pods, shard = JOB_COMPLETION_INDEX. Client-side validated only; NOT applied to a cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-label
  namespace: pipeline
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cloud-assignment/worker:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          env:
            - {name: SHARD_COUNT, value: "2"}
            - {name: TEACHER_MODEL, value: "phi3.5"}
            - {name: OLLAMA_HOST, value: "http://host.k3d.internal:11434"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: DATASETS_BUCKET, value: "datasets"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}

apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-parser
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: command-parser}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: command-parser}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: service
          image: command-parser:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: MODEL_URI, value: "s3://models/v1"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: command-parser
  namespace: app
spec:
  selector: {app: command-parser}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser
  namespace: app
spec:
  ingressClassName: traefik   # bundled with k3s
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: command-parser, port: {number: 80}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: command-parser
  namespace: app
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: command-parser}
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # shorter than the 300 s default so scale-down is observable in a short demo
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: command-parser
  namespace: app
spec:
  minAvailable: 1        # voluntary disruptions (e.g. a node drain) may never remove the last ready replica
  selector:
    matchLabels: {app: command-parser}

# Student training configuration (Task 2). `make train` reads only this file (plus CLI overrides).
# Values are PLANNED settings, not results of a run.
model_name: EleutherAI/pythia-70m
seed: 42
learning_rate: 0.00005
weight_decay: 0.01
batch_size: 8
epochs: 3
max_seq_len: 128
train_limit: 1500        # first 1,500 cleaned records only
train_file: datasets/v1/train.jsonl
output_dir: training/output
# Library versions the run is intended for (pinned in training/requirements.txt). train.py also records the versions it actually
# imported in training/output/<version>/run_info.json.
libraries:
  python: "3.11"
  torch: "2.4.1"
  transformers: "4.44.2"
  tokenizers: "0.19.1"
  numpy: "1.26.4"
  pyyaml: "6.0.2"
